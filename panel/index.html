<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة الإدارة</title>
<style>
:root{--bar:#0F1E33;--chip:#ffffff1f;--on:#ffffff;--onink:#0F1E33;--bg:#EAF1FA;
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:var(--font)}
body{display:flex;flex-direction:column}
.bar{background:var(--bar);padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));display:flex;justify-content:center}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:4px;gap:4px}
.seg button{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:999px;padding:8px 22px;background:transparent;color:#fff;cursor:pointer}
.seg button[aria-selected=true]{background:var(--on);color:var(--onink)}
.seg button:focus-visible{outline:2px solid #F28C28;outline-offset:2px}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<div class="bar"><div class="seg" role="tablist">
  <button role="tab" data-app="musmach" aria-selected="true">מוסמך</button>
  <button role="tab" data-app="yalla" aria-selected="false">يلّا</button>
</div></div>
<iframe id="musmach" title="מוסמך" data-src="../admin.html"></iframe>
<iframe id="yalla" title="يلّا" data-src="../yalla/" hidden></iframe>
<script>
const KEY='panel-app';
function pick(app){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-selected', b.dataset.app===app));
  document.querySelectorAll('iframe').forEach(f=>{ const on=f.id===app; f.hidden=!on; if(on && !f.src) f.src=f.dataset.src; });
  try{localStorage.setItem(KEY,app)}catch(e){}
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>pick(b.dataset.app));
let start='musmach'; try{start=localStorage.getItem(KEY)||'musmach'}catch(e){}
pick(start);
</script>
</body>
</html>

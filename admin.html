<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="app/icon.png">
<title>מוסמך · لوحة الإدارة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="import-tools.js"></script>
<script src="assets/ptr.js?v=2"></script>
<style>
:root{--bg:#EAF1FA;--surface:#fff;--ink:#0F1E33;--muted:#566A85;--line:#D2DEEC;--accent:#1554A8;--accent-soft:#DCE8F8;--ok:#1F8A4C;--ok-soft:#DDF2E5;--bad:#C2413A;--bad-soft:#F8E0DE;--amber-soft:#FBEBCF;
  --font:"IBM Plex Sans Arabic","IBM Plex Sans Hebrew",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
label{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:760px){.grid2,.grid4{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{flex:1;min-width:140px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:600 14px var(--font);cursor:pointer;flex:none;min-width:0}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
tr.click{cursor:pointer}tr.click:hover{background:var(--accent-soft)}
.tbl{overflow-x:auto}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.off{background:var(--amber-soft);color:#8a5a0a}
.msg{border-radius:8px;padding:8px 12px;font-size:14px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted);font-size:13px}
.he{font-family:"IBM Plex Sans Hebrew",var(--font)}
.opt{display:flex;gap:8px;align-items:center}
.opt input[type=radio]{width:auto;flex:none}
.stat{font-size:28px;font-weight:600}
[hidden]{display:none!important}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.sumgrid div{background:#f4f6fa;border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center}.sumgrid b{font-size:22px}.sumgrid span{font-size:12px;color:#666}
.bars{display:flex;align-items:flex-end;gap:2px;height:140px;padding-top:6px}.bcol{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%;min-width:2px}.bcol i{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.bax{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.li{position:relative;display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;overflow:hidden}.li>span{position:relative;z-index:1}.lbar{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent-soft)}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
/* ===== Rishui admin panel — open this file in Chrome/Edge on your computer ===== */
// tracks and topics come from the database (tables "tracks" and "topics")
let TRACKS = [], TOPICS_BY = {}; // TOPICS_BY[track][topicId] = Hebrew name
let curTrack = localStorage.getItem("rs-track") || "nursing";
const TOPICS_OF = tr => TOPICS_BY[tr] || {};
const trackLabel = id => { const x = TRACKS.find(t => t.id === id); return x ? `${x.icon || ""} ${x.he}` : id; };
async function loadMeta() {
  const [{ data: tr }, { data: tp }] = await Promise.all([
    sb.from("tracks").select("*").order("sort"), sb.from("topics").select("*").order("sort")]);
  TRACKS = tr || []; TOPICS_BY = {};
  for (const t of tp || []) (TOPICS_BY[t.track] = TOPICS_BY[t.track] || {})[t.id] = t.he;
  if (!TRACKS.find(t => t.id === curTrack) && TRACKS[0]) curTrack = TRACKS[0].id;
}
const root = document.getElementById("root");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const $ = id => document.getElementById(id);
const cfg = { url: localStorage.getItem("rs-url") || "https://bbslhbcmfjfjbvqqcebg.supabase.co", key: localStorage.getItem("rs-key") || "sb_publishable_-PUr33K468fu-ywZehsbZQ_QBQnHeQX" };
let sb = null, me = null, tab = "list", editing = null, listState = { topic: "", pub: "", q: "", page: 0 }, flashMsg = null;

function msg(text, ok = true) { flashMsg = { text, ok }; }
function msgHtml() { const m = flashMsg; flashMsg = null; return m ? `<div class="msg ${m.ok ? "ok" : "bad"}">${esc(m.text)}</div>` : ""; }

/* ---------- setup + login ---------- */
function setup() {
  root.innerHTML = `<h1>لوحة إدارة מוסמך</h1>${msgHtml()}
  <div class="card"><h3>ربط المشروع (مرة وحدة)</h3>
    <p class="muted">من Supabase → Project Settings → API انسخ الـ Project URL والـ anon public key.</p>
    <label>Project URL</label><input id="u" dir="ltr" value="${esc(cfg.url)}" placeholder="https://xxxx.supabase.co">
    <label>anon public key</label><input id="k" dir="ltr" value="${esc(cfg.key)}">
    <button class="btn" id="s">حفظ</button></div>`;
  $("s").onclick = () => {
    cfg.url = $("u").value.trim(); cfg.key = $("k").value.trim();
    localStorage.setItem("rs-url", cfg.url); localStorage.setItem("rs-key", cfg.key); start();
  };
}
function login() {
  root.innerHTML = `<h1>لوحة إدارة מוסמך</h1>${msgHtml()}
  <form class="card" id="f"><h3>تسجيل دخول المدير</h3>
    <label>الإيميل</label><input id="e" type="email" dir="ltr">
    <label>الباسوورد</label><input id="p" type="password" dir="ltr">
    <button class="btn" type="submit">دخول</button>
    <button class="btn ghost" type="button" id="cfg">تغيير ربط المشروع</button></form>`;
  $("cfg").onclick = setup;
  $("f").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $("e").value.trim(), password: $("p").value });
    if (error) { msg("الإيميل أو الباسوورد غلط", false); return login(); }
    start();
  };
}
async function start() {
  if (!cfg.url || !cfg.key) return setup();
  sb = sb || supabase.createClient(cfg.url, cfg.key);
  const { data } = await sb.auth.getSession();
  if (!data.session) return login();
  const { data: p } = await sb.from("profiles").select("*").eq("id", data.session.user.id).single();
  if (!p || p.role !== "admin") {
    await sb.auth.signOut();
    msg("هاد الحساب مش مدير. شغّل أمر تعيين المدير من الدليل.", false); return login();
  }
  me = p; await loadMeta(); render();
}

/* ---------- layout ---------- */
function render() {
  const tabs = [["list","الأسئلة"],["edit", editing?.id ? "تعديل سؤال" : "إضافة سؤال"],["import","استيراد"],["reports","التبليغات"],["messages","الرسائل"],["codes","أكواد الدخول"],["tracks","المسارات والمواضيع"],["users","المستخدمين"],["ann","📢 إعلانات"],["past","📚 امتحانات سابقة"],["stats","أرقام"]];
  root.innerHTML = `<div class="top"><h1>لوحة إدارة מוסמך</h1><div class="row" style="flex:none"><span class="muted" dir="ltr">${esc(me.email)}</span><button class="btn ghost" id="rf" title="تحديث">🔄 تحديث</button><button class="btn ghost" id="out">خروج</button></div></div>
  <div class="row" style="justify-content:flex-start"><label style="flex:none">المسار:</label><select id="ctr" style="flex:none;min-width:200px">${TRACKS.map(t => `<option value="${t.id}" ${t.id===curTrack?"selected":""}>${esc(trackLabel(t.id))}</option>`).join("")}</select></div>
  <div class="tabs">${tabs.map(([k,n]) => `<button data-t="${k}" class="${tab===k?"on":""}">${n}</button>`).join("")}</div>
  ${msgHtml()}<div id="body"></div>`;
  root.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; if (tab === "edit" && b.textContent === "إضافة سؤال") editing = null; render(); });
  $("ctr").onchange = () => { curTrack = $("ctr").value; localStorage.setItem("rs-track", curTrack); listState.topic = ""; editing = null; render(); };
  $("rf").onclick = () => { $("rf").disabled = true; render(); };
  $("out").onclick = async () => { await sb.auth.signOut(); me = null; start(); };
  ({ list: viewList, edit: viewEdit, import: viewImport, reports: viewReports, messages: viewMessages, codes: viewCodes, tracks: viewTracks, users: viewUsers, ann: viewAnn, past: viewPast, stats: viewStats })[tab]();
}

/* ---------- list ---------- */
const PAGE = 50;
async function viewList() {
  const b = $("body"), s = listState;
  b.innerHTML = `<div class="card"><div class="row">
    <select id="ft"><option value="">كل المواضيع</option>${Object.entries(TOPICS_OF(curTrack)).map(([k,n]) => `<option value="${k}" ${s.topic===k?"selected":""}>${esc(n)}</option>`).join("")}</select>
    <select id="fp"><option value="">منشور وغير منشور</option><option value="1" ${s.pub==="1"?"selected":""}>منشور</option><option value="0" ${s.pub==="0"?"selected":""}>غير منشور</option></select>
    <input id="fq" placeholder="بحث بنص السؤال" value="${esc(s.q)}">
    <button class="btn" id="go">بحث</button><button class="btn ghost" id="new">+ سؤال جديد</button><button class="btn" id="puball" style="display:none"></button></div>
    <div class="tbl"><table><thead><tr><th>#</th><th>الموضوع</th><th>السؤال (עברית)</th><th>الحالة</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="muted">بحمّل…</td></tr></tbody></table></div>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" id="pv">السابق</button><span class="muted" id="pg"></span><button class="btn ghost" id="nx">التالي</button></div></div>`;
  $("go").onclick = () => { s.topic = $("ft").value; s.pub = $("fp").value; s.q = $("fq").value.trim(); s.page = 0; viewList(); };
  $("new").onclick = () => { editing = null; tab = "edit"; render(); };
  $("pv").onclick = () => { if (s.page > 0) { s.page--; viewList(); } };
  $("nx").onclick = () => { s.page++; viewList(); };
  let q = sb.from("questions").select("id,topic,he,published,is_free", { count: "exact" }).eq("track", curTrack).order("id").range(s.page*PAGE, s.page*PAGE+PAGE-1);
  if (s.topic) q = q.eq("topic", s.topic);
  if (s.pub) q = q.eq("published", s.pub === "1");
  if (s.q) { const w = s.q.replace(/[,()*%]/g, " "); q = q.or(`he->>q.ilike.*${w}*,en->>q.ilike.*${w}*`); }
  const { data, count, error } = await q;
  if (error) { $("rows").innerHTML = `<tr><td colspan="4">${esc(error.message)}</td></tr>`; return; }
  $("pg").textContent = `${count} سؤال · صفحة ${s.page+1} من ${Math.max(1, Math.ceil(count/PAGE))}`;
  $("rows").innerHTML = data.length ? data.map(r => `<tr class="click" data-id="${r.id}"><td>${r.id}</td><td>${esc(TOPICS_OF(curTrack)[r.topic] || r.topic)}</td><td class="he" dir="rtl">${esc((r.he?.q || "").slice(0,120))}</td><td>${r.published ? `<span class="pill">منشور</span>` : `<span class="pill off">مسودة</span>`} ${r.is_free ? `<span class="pill">مجاني</span>` : ""}</td></tr>`).join("") : `<tr><td colspan="4" class="muted">ما في نتائج</td></tr>`;
  $("rows").querySelectorAll("tr.click").forEach(tr => tr.onclick = () => openEditor(+tr.dataset.id));
  // publish every draft of this track (optionally only the chosen topic) in one go
  let dq = sb.from("questions").select("id", { count: "exact", head: true }).eq("track", curTrack).eq("published", false);
  if (s.topic) dq = dq.eq("topic", s.topic);
  const { count: drafts } = await dq;
  const pb = $("puball");
  if (pb && drafts) {
    pb.style.display = ""; pb.textContent = `انشر كل المسودات (${drafts})`;
    pb.onclick = async () => {
      if (pb.dataset.sure !== "1") { pb.dataset.sure = "1"; pb.textContent = `متأكد؟ اضغط كمان مرة لنشر ${drafts} سؤال`; return; }
      pb.disabled = true;
      let u = sb.from("questions").update({ published: true, updated_at: new Date().toISOString() }).eq("track", curTrack).eq("published", false);
      if (s.topic) u = u.eq("topic", s.topic);
      const { error } = await u;
      if (error) { msg(error.message, false); return render(); }
      msg(`انتشروا ${drafts} سؤال`); viewList();
    };
  }
}
async function openEditor(id) {
  const { data, error } = await sb.from("questions").select("*").eq("id", id).single();
  if (error) { msg(error.message, false); return render(); }
  editing = data; tab = "edit"; render();
}

/* ---------- edit ---------- */
function viewEdit() {
  const q = editing || { track: curTrack, topic: Object.keys(TOPICS_OF(curTrack))[0] || "", answer: 0, he: { q:"", o:["","","",""], e:"" }, en: { q:"", o:["","","",""], e:"" }, terms: [], source: "", is_free: false, published: false, reviewed_by: "" };
  const opts = (lang, dir) => q[lang].o.map((o,i) => `<div class="opt"><input type="radio" name="ans" value="${i}" ${q.answer===i?"checked":""} aria-label="الجواب الصحيح ${i+1}"><input id="${lang}-o${i}" dir="${dir}" value="${esc(o)}" placeholder="خيار ${i+1}"></div>`).join("");
  $("body").innerHTML = `<form class="card" id="f">
    <h3>${q.id ? `تعديل سؤال #${q.id}` : "سؤال جديد"}</h3>
    <div class="row"><div><label>المسار</label><select id="trk">${TRACKS.map(t => `<option value="${t.id}" ${(q.track||curTrack)===t.id?"selected":""}>${esc(trackLabel(t.id))}</option>`).join("")}</select></div>
      <div><label>الموضوع</label><select id="tp"></select></div>
      <div><label>راجعه</label><input id="rv" value="${esc(q.reviewed_by || "")}"></div></div>
    <p class="muted">علّم الدائرة جنب الجواب الصحيح (نفس الترتيب بالعبري والإنجليزي).</p>
    <div class="grid2">
      <div class="he" dir="rtl"><label>שאלה (עברית)</label><textarea id="he-q">${esc(q.he.q)}</textarea>${opts("he","rtl")}<label>הסבר (עברית)</label><textarea id="he-e">${esc(q.he.e)}</textarea></div>
      <div dir="ltr"><label>Question (English)</label><textarea id="en-q">${esc(q.en.q)}</textarea>${q.en.o.map((o,i) => `<input id="en-o${i}" value="${esc(o)}" placeholder="Option ${i+1}" style="margin-top:6px">`).join("")}<label>Explanation (English)</label><textarea id="en-e">${esc(q.en.e)}</textarea></div>
    </div>
    <label>المصدر (كتاب، فصل، إرشادات)</label><input id="src" dir="ltr" value="${esc(q.source)}">
    <label>مصطلحات: كل سطر "English | עברית"</label><textarea id="tm" dir="ltr">${esc((q.terms||[]).map(x => x.join(" | ")).join("\n"))}</textarea>
    <div class="row" style="justify-content:flex-start"><label style="flex:none"><input type="checkbox" id="pb" style="width:auto" ${q.published?"checked":""}> منشور للطلاب</label>
      <label style="flex:none"><input type="checkbox" id="fr" style="width:auto" ${q.is_free?"checked":""}> سؤال مجاني (عيّنة)</label></div>
    <div class="row" style="justify-content:flex-start"><button class="btn" type="submit">حفظ</button>${q.id ? `<button class="btn danger" type="button" id="del">حذف</button>` : ""}<button class="btn ghost" type="button" id="cn">رجوع للقائمة</button></div>
    <div id="er"></div>
  </form>`;
  const fillTopics = () => { const tr = $("trk").value; $("tp").innerHTML = Object.entries(TOPICS_OF(tr)).map(([k,n]) => `<option value="${k}" ${q.topic===k?"selected":""}>${esc(n)}</option>`).join(""); };
  fillTopics(); $("trk").onchange = fillTopics;
  $("cn").onclick = () => { editing = null; tab = "list"; render(); };
  let armed = false;
  if ($("del")) $("del").onclick = async () => {
    if (!armed) { armed = true; $("del").textContent = "متأكد؟ اضغط كمان مرة للحذف"; return; }
    const { error } = await sb.from("questions").delete().eq("id", q.id);
    if (error) { $("er").innerHTML = `<div class="msg bad">${esc(error.message)}</div>`; return; }
    msg("انحذف السؤال"); editing = null; tab = "list"; render();
  };
  $("f").onsubmit = async e => {
    e.preventDefault();
    const v = id => $(id).value.trim();
    const ans = root.querySelector("input[name=ans]:checked");
    const row = {
      track: v("trk"), topic: v("tp"), answer: ans ? +ans.value : -1,
      he: { q: v("he-q"), o: [0,1,2,3].map(i => v("he-o"+i)), e: v("he-e") },
      en: { q: v("en-q"), o: [0,1,2,3].map(i => v("en-o"+i)), e: v("en-e") },
      terms: v("tm").split("\n").map(l => l.split("|").map(x => x.trim())).filter(p => p.length === 2 && p[0] && p[1]),
      source: v("src"), reviewed_by: v("rv") || null, published: $("pb").checked, is_free: $("fr").checked, updated_at: new Date().toISOString(),
    };
    const problems = validate(row);
    if (problems.length) { $("er").innerHTML = `<div class="msg bad">${problems.map(esc).join("<br>")}</div>`; return; }
    const res = q.id ? await sb.from("questions").update(row).eq("id", q.id).select().single() : await sb.from("questions").insert(row).select().single();
    if (res.error) { $("er").innerHTML = `<div class="msg bad">${esc(res.error.message)}</div>`; return; }
    msg(q.id ? `انحفظ السؤال #${res.data.id}` : `انضاف سؤال #${res.data.id}`);
    editing = q.id ? res.data : null; render();
  };
}
function validate(r) {
  const p = [];
  if (!TOPICS_OF(r.track)[r.topic]) p.push(`موضوع غير معروف بمسار ${r.track}: ${r.topic}`);
  if (!(r.answer >= 0 && r.answer <= 3)) p.push("لازم تختار الجواب الصحيح");
  for (const [l,n] of [["he","العبري"],["en","الإنجليزي"]]) {
    if (!r[l].q) p.push(`نص السؤال ب${n} فاضي`);
    if (r[l].o.length !== 4 || r[l].o.some(o => !o)) p.push(`لازم ٤ خيارات ب${n}`);
    if (!r[l].e) p.push(`الشرح ب${n} فاضي`);
  }
  if (!r.source) p.push("المصدر فاضي");
  return p;
}

/* ---------- import ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function rowsFromCSV(text) {
  return ImportTools.rowsFromTable(parseCSV(text.replace(/^\uFEFF/, "")), importCtx()).rows;
}
function rowsFromXLSX(buf) {
  if (!window.XLSX) throw new Error("قارئ ملفات Excel ما انحمّل. افحص الإنترنت وجرّب كمان مرة.");
  const wb = XLSX.read(buf, { type: "array" });
  // the sheet with the questions: "שאלות" in our template, otherwise the first sheet that has a known header
  const names = ["שאלות", ...wb.SheetNames];
  for (const n of names) {
    const ws = wb.Sheets[n]; if (!ws) continue;
    const res = ImportTools.rowsFromTable(XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "" }), importCtx());
    if (res.layout) return res.rows;
  }

// adds in small groups; if a group fails, its rows are tried one by one so one bad row doesn't stop the rest
async function runImport(list) {
  $("go").disabled = true;
  const pub = $("pub").checked, ses = +$("ses").value || null;
  const clean = (r) => { const { line, heOnly, ...x } = r; return { ...x, published: pub, ...(ses ? { session_id: ses, session_order: list.indexOf(r) + 1 } : {}) }; };
  let added = 0; const failed = [];
  for (let i = 0; i < list.length; i += 50) {
    const chunk = list.slice(i, i + 50);
    $("go").textContent = `بضيف… ${added}/${list.length}`;
    const { error } = await sb.from("questions").insert(chunk.map(clean));
    if (!error) { added += chunk.length; continue; }
    for (const r of chunk) {
      const { error: e1 } = await sb.from("questions").insert(clean(r));
      if (e1) failed.push([r.line, e1.message]); else added++;
    }
  }
  $("pre").insertAdjacentHTML("beforeend", `<div class="msg ${failed.length ? "bad" : ""}"><b>انضاف ${added} سؤال${pub ? " (منشورين)" : " (مسودة)"}.</b>${failed.length ? `<br>ما انضافوا ${failed.length}:<br>${failed.map(([n, m]) => `سطر ${n}: ${esc(m)}`).join("<br>")}` : ""}</div>`);
  $("go").remove();
  msg(`انضاف ${added} سؤال`);
}

    <td class="row" style="flex-wrap:nowrap"><button class="btn ${x.published ? "ghost" : ""}" data-pub="${x.id}" data-v="${x.published ? 0 : 1}">${x.published ? "إخفاء" : "إظهار للطلاب"}</button>
      ${counts[x.id][0] ? "" : `<button class="btn danger" data-del="${x.id}">حذف</button>`}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">لسا ما في امتحانات سابقة</td></tr>`;
  $("rows").querySelectorAll("[data-pub]").forEach(b => b.onclick = async () => { await sb.from("exam_sessions").update({ published: b.dataset.v === "1" }).eq("id", +b.dataset.pub); viewPast(); });
  $("rows").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { await sb.from("exam_sessions").delete().eq("id", +b.dataset.del); viewPast(); });
}

/* ---------- announcements ---------- */
async function viewAnn() {
  $("body").innerHTML = `<div class="card"><h3>إعلان جديد للطلاب</h3>
    <p class="muted">بيطلع للطلاب فوق بالصفحة الرئيسية بالتطبيق، لحد ما يضغطوا "הבנתי". اكتب باللغة اللي بدك ياها (الطلاب أغلبهم بالعبري).</p>
    <label>العنوان</label><input id="at" maxlength="120" dir="auto" placeholder="مثلًا: נוספו 200 שאלות חדשות! 🎉">
    <label>النص (اختياري)</label><textarea id="ab" maxlength="2000" dir="auto" placeholder="تفاصيل..."></textarea>
    <div class="row"><div><label>لمين</label><select id="atr"><option value="">كل الطلاب</option>${TRACKS.map(t => `<option value="${t.id}">${esc(trackLabel(t.id))} بس</option>`).join("")}</select></div>
      <div><label>لقديش يضل ظاهر</label><select id="ad"><option value="1">يوم</option><option value="3">3 أيام</option><option value="7" selected>أسبوع</option><option value="30">شهر</option><option value="">لحد ما أوقفه</option></select></div></div>
    <div id="apv"></div>
    <button class="btn" id="asend" style="align-self:flex-start">📢 انشر الإعلان</button></div>
    <div class="card"><h3>الإعلانات</h3><div class="tbl"><table><thead><tr><th>الإعلان</th><th>لمين</th><th>تاريخ</th><th>الحالة</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">بحمّل…</td></tr></tbody></table></div></div>`;
  const prev = () => { const t = $("at").value.trim(), b = $("ab").value.trim();
    $("apv").innerHTML = t ? `<label>هيك رح يطلع للطالب:</label><div style="background:var(--accent-soft);border-radius:12px;padding:12px" dir="auto"><b>📢 ${esc(t)}</b>${b ? `<p style="margin:6px 0 0;white-space:pre-line">${esc(b)}</p>` : ""}</div>` : ""; };
  $("at").oninput = prev; $("ab").oninput = prev;
  $("asend").onclick = async () => {
    const title = $("at").value.trim(); if (!title) { $("at").focus(); return; }
    const days = $("ad").value, row = { title, body: $("ab").value.trim() || null, track: $("atr").value || null,
      expires_at: days ? new Date(Date.now() + days * 864e5).toISOString() : null };
    $("asend").disabled = true;
    const { error } = await sb.from("announcements").insert(row);
    if (error) { msg(/announcements/.test(error.message) ? "لازم تشغّل supabase/migration-18-announcements.sql بـ Supabase أول." : error.message, false); }
    else msg("✅ انشر الإعلان. الطلاب رح يشوفوه لما يفتحوا التطبيق.");
    render();
  };
  const { data, error } = await sb.from("announcements").select("*").order("created_at", { ascending: false }).limit(50);
  if (error) { $("rows").innerHTML = `<tr><td colspan="5" class="msg bad">لازم تشغّل supabase/migration-18-announcements.sql بـ Supabase أول.</td></tr>`; return; }
  const live = a => a.active && (!a.expires_at || new Date(a.expires_at) > new Date());
  $("rows").innerHTML = (data || []).map(a => `<tr><td dir="auto"><b>${esc(a.title)}</b>${a.body ? `<div class="muted" style="white-space:pre-line">${esc(a.body)}</div>` : ""}</td>
    <td>${a.track ? esc(trackLabel(a.track)) : "الكل"}</td><td dir="ltr" style="text-align:start">${fmtDT(a.created_at)}</td>
    <td>${live(a) ? `<span class="pill">ظاهر${a.expires_at ? " لحد " + esc(a.expires_at.slice(0, 10)) : ""}</span>` : `<span class="pill off">موقوف</span>`}</td>
    <td>${live(a) ? `<button class="btn danger" data-off="${a.id}">وقّف</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">لسا ما نشرت إعلانات</td></tr>`;
  $("rows").querySelectorAll("[data-off]").forEach(b => b.onclick = async () => { await sb.from("announcements").update({ active: false }).eq("id", +b.dataset.off); viewAnn(); });
}

/* ---------- users ---------- */
let userState = { q: "", page: 0 };
const fmtDT = d => d ? new Date(d).toLocaleString("en-GB", { timeZone: "Asia/Jerusalem", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
async function viewUsers() {
  const s = userState, PAGE = 50;
  $("body").innerHTML = `<div class="card"><div class="row"><input id="uq" dir="ltr" placeholder="ابحث بالإيميل…" value="${esc(s.q)}"><button class="btn" id="ugo" style="flex:none">بحث</button></div>
    <div class="muted" id="ucount">بحمّل…</div>
    <div class="tbl"><table><thead><tr><th>#</th><th>الإيميل</th><th>سجّل بتاريخ</th><th>المسار</th><th>موعد الامتحان</th><th>الاشتراك</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="muted">بحمّل…</td></tr></tbody></table></div>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" id="upr" style="flex:none">→ السابق</button><span class="muted" id="upg"></span><button class="btn ghost" id="unx" style="flex:none">التالي ←</button></div></div>`;
  const go = () => { s.q = $("uq").value.trim(); s.page = 0; viewUsers(); };
  $("ugo").onclick = go; $("uq").onkeydown = e => { if (e.key === "Enter") go(); };
  let q = sb.from("profiles").select("email,created_at,track,exam_date,role,plan,plan_until", { count: "exact" }).order("created_at", { ascending: false }).range(s.page * PAGE, s.page * PAGE + PAGE - 1);
  if (s.q) q = q.ilike("email", `%${s.q}%`);
  const { data, count, error } = await q;
  if (error) { $("rows").innerHTML = `<tr><td colspan="6" class="msg bad">${esc(error.message)}</td></tr>`; return; }
  const today = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Jerusalem" });
  const newToday = (data || []).filter(u => new Date(u.created_at).toLocaleDateString("en-CA", { timeZone: "Asia/Jerusalem" }) === today).length;
  $("ucount").textContent = `${s.q ? "نتائج البحث" : "كل المستخدمين"}: ${count ?? 0}` + (!s.q && !s.page ? ` · سجّلوا اليوم: ${newToday}` : "");
  const sub = u => u.role === "admin" ? `<span class="pill">مدير</span>` : u.plan_until && new Date(u.plan_until) > new Date() ? `<span class="pill">${u.plan === "code" ? "كود" : u.plan === "exam" ? "لحد الامتحان" : "شهري"} · لحد ${esc(String(u.plan_until).slice(0, 10))}</span>` : `<span class="muted">مجاني</span>`;
  $("rows").innerHTML = (data || []).map((u, i) => `<tr><td>${s.page * PAGE + i + 1}</td><td dir="ltr" style="text-align:start"><a href="mailto:${esc(u.email)}">${esc(u.email)}</a></td><td dir="ltr" style="text-align:start">${fmtDT(u.created_at)}</td><td class="he">${esc(u.track ? trackLabel(u.track) : "—")}</td><td dir="ltr" style="text-align:start">${esc(u.exam_date || "—")}</td><td>${sub(u)}</td></tr>`).join("")
    || `<tr><td colspan="6" class="muted">ما في مستخدمين</td></tr>`;
  const pages = Math.max(1, Math.ceil((count || 0) / PAGE));
  $("upg").textContent = `صفحة ${s.page + 1} من ${pages}`;
  $("upr").disabled = s.page === 0; $("unx").disabled = s.page + 1 >= pages;
  $("upr").onclick = () => { s.page--; viewUsers(); }; $("unx").onclick = () => { s.page++; viewUsers(); };
}

/* ---------- stats ---------- */
let statDays = 30;
const ZONES = { "Asia/Jerusalem": "إسرائيل", "Asia/Tel_Aviv": "إسرائيل", "Asia/Hebron": "فلسطين", "Asia/Gaza": "فلسطين", "Asia/Amman": "الأردن", "Europe/Berlin": "ألمانيا", "Europe/London": "بريطانيا", "America/New_York": "أمريكا", "Asia/Dubai": "الإمارات", "Europe/Moscow": "روسيا", "Africa/Cairo": "مصر" };
const DEV = { mobile: "📱 تلفون", desktop: "💻 كمبيوتر", tablet: "📲 تابلت" };
const PAGES = { "/": "الصفحة الرئيسية", "/app/": "التطبيق بالمتصفح", "/admin.html": "لوحة الإدارة", "/legal/": "الصفحات القانونية", "/legal/privacy-he.html": "الخصوصية (عبري)", "/legal/terms-he.html": "الشروط (عبري)", "/legal/privacy-en.html": "الخصوصية (إنجليزي)", "/legal/terms-en.html": "الشروط (إنجليزي)" };
const num = n => Number(n || 0).toLocaleString("en-US");
function bars(rows, keys, colors) {
  const max = Math.max(1, ...rows.flatMap(r => keys.map(k => +r[k] || 0)));
  return `<div class="bars">${rows.map(r => `<div class="bcol" title="${esc(r.d)}: ${keys.map(k => num(r[k])).join(" / ")}">${keys.map((k, i) => `<i style="height:${Math.round(100 * (+r[k] || 0) / max)}%;background:${colors[i]}"></i>`).join("")}</div>`).join("")}</div>
    <div class="bax"><span>${esc(rows[0]?.d || "")}</span><span>${esc(rows.at(-1)?.d || "")}</span></div>`;
}
function topList(title, rows, label) {
  const total = rows.reduce((s, r) => s + +r.n, 0) || 1;
  return `<div class="card"><b>${title}</b>${rows.length ? rows.map(r => `<div class="li"><span>${esc(label(r.k))}</span><span class="muted">${num(r.n)}</span><div class="lbar" style="width:${Math.round(100 * r.n / total)}%"></div></div>`).join("") : `<span class="muted">لسا ما في</span>`}</div>`;
}
const cardsHtml = list => `<div class="grid4">${list.map(([n, v, sub]) => `<div class="card"><span class="muted">${n}</span><span class="stat">${v}</span>${sub ? `<span class="muted">${sub}</span>` : ""}</div>`).join("")}</div>`;
async function viewStats() {
  $("body").innerHTML = `<div class="row" style="justify-content:flex-start">${[7, 30, 90].map(d => `<button class="btn ${d === statDays ? "" : "ghost"}" data-d="${d}">آخر ${d} يوم</button>`).join("")}</div><div id="st"><div class="card"><span class="muted">بحمّل…</span></div></div>`;
  $("body").querySelectorAll("[data-d]").forEach(b => b.onclick = () => { statDays = +b.dataset.d; viewStats(); });
  const now = new Date().toISOString();
  const [{ data: r, error }, u, a, q, p, { data: cfg, error: ce }] = await Promise.all([
    sb.rpc("admin_stats", { p_days: statDays }),
    sb.from("profiles").select("id", { count: "exact", head: true }),
    sb.from("profiles").select("id", { count: "exact", head: true }).gt("plan_until", now),
    sb.from("questions").select("id", { count: "exact", head: true }),
    sb.from("questions").select("id", { count: "exact", head: true }).eq("published", true),
    sb.from("app_settings").select("free_mode").eq("id", 1).maybeSingle(),
  ]);
  let h = "";
  if (error || !r) {
    h += `<div class="msg bad">إحصائيات الزوار والطلاب مش جاهزة: شغّل supabase/migration-17-site-stats.sql بـ Supabase. ${esc(error?.message || "")}</div>`;
  } else {
    const s = r.site, ap = r.app, acc = ap.answers ? Math.round(100 * ap.correct / ap.answers) : 0;
    h += `<h3>🌐 زوار الموقع</h3>` + cardsHtml([
      ["زوار اليوم", num(s.today_visitors)], [`زوار آخر ${statDays} يوم`, num(s.visitors), "كل شخص مرة وحدة"],
      ["مرات فتح الصفحات", num(s.visits)], ["فتحوا التطبيق بالمتصفح", num(s.app_visitors)]]);
    h += `<div class="card"><b>زوار كل يوم</b>${bars(s.by_day, ["n"], ["var(--accent)"])}</div>`;
    h += `<div class="grid2">` + topList("من وين إجوا", s.refs, k => k || "دخلوا مباشرة / واتساب / تطبيق") + topList("أي صفحات فتحوا", s.pages, k => PAGES[k] || k)
       + topList("نوع الجهاز", s.devices, k => DEV[k] || k) + topList("من أي بلد (تقريبًا)", s.zones, k => ZONES[k] || k) + `</div>`;
    h += `<h3>🎓 الطلاب بالتطبيق</h3>` + cardsHtml([
      ["سجّلوا اليوم", num(ap.new_today)], [`سجّلوا آخر ${statDays} يوم`, num(ap.new_users), `من أصل ${num(ap.users)}`],
      ["حلّوا أسئلة اليوم", num(ap.active_today)], ["حلّوا أسئلة آخر 7 أيام", num(ap.active_7)],
      [`إجابات آخر ${statDays} يوم`, num(ap.answers), `${acc}% صحيحة`], ["طلاب شغّالين بالفترة", num(ap.active)],
      ["امتحانات خلصت", num(ap.exams_done)], ["مهمات يومية خلصت", num(ap.missions_done)]]);
    h += `<div class="card"><b>كل يوم: <span style="color:var(--ok)">■</span> سجّلوا جديد · <span style="color:var(--accent)">■</span> حلّوا أسئلة</b>${bars(ap.signups_by_day, ["n", "a"], ["var(--ok)", "var(--accent)"])}</div>`;
    h += `<div class="card"><b>أصعب المواضيع (أقل نسبة إجابات صحيحة)</b>${ap.hard_topics.length ? `<div class="tbl"><table><thead><tr><th>الموضوع</th><th>إجابات</th><th>صحيحة</th></tr></thead><tbody>${ap.hard_topics.map(t => `<tr><td class="he">${esc(trackLabel(t.track))} · ${esc(TOPICS_OF(t.track)[t.k] || t.k)}</td><td>${num(t.n)}</td><td>${t.pct}%</td></tr>`).join("")}</tbody></table></div>` : `<span class="muted">بتظهر لما يكون في 10 إجابات على الأقل بالموضوع.</span>`}</div>`;
  }
  h += `<h3>📦 عام</h3>` + cardsHtml([["كل المستخدمين", num(u.count)], ["اشتراكات فعّالة", num(a.count)], ["كل الأسئلة", num(q.count)], ["منشورة", num(p.count)]]);
  h += ce || !cfg ? `<div class="card"><b>الوضع المجاني</b><p class="muted">شغّل supabase/migration-5-free-mode.sql عشان يظهر هاد الخيار.</p></div>`
    : `<div class="card"><b>الوضع المجاني: ${cfg.free_mode ? "🟢 شغّال (كل الأسئلة ببلاش)" : "⚪ مطفي (بدها اشتراك)"}</b>
       <p class="muted">لما يكون شغّال، كل طالب مسجّل بيحل كل أسئلة مساره بدون اشتراك.</p>
       <button class="btn" id="fm" style="align-self:flex-start">${cfg.free_mode ? "طفّي الوضع المجاني" : "شغّل الوضع المجاني"}</button></div>`;
  $("st").innerHTML = h; $("st").style.cssText = "display:flex;flex-direction:column;gap:12px";
  if ($("fm")) $("fm").onclick = async () => { await sb.from("app_settings").update({ free_mode: !cfg.free_mode }).eq("id", 1); viewStats(); };
}

start();
</script>
</body>
</html>
